name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Check and build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust from rust-toolchain.toml
        run: rustup show active-toolchain

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            fonts-noto-cjk \
            liblzma-dev \
            libmpv-dev \
            libsqlite3-dev \
            ninja-build \
            pkg-config \
            xvfb

      - name: Check and build Linux
        run: scripts/check.sh --linux
